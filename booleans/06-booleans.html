<!DOCTYPE html>
<html lang="en">

    <title>booleans</title>
</head>
<body>
    <script>
        console.log( typeof 'true');//string
        console.log( typeof true); //boolean


        console.log(3 < 5);//true
        console.log(3 > 5);//false

        console.log(5 === '5.00');// true == convert both the value in same type then compare so we use the ===for the comparison


        if(true) {
            console.log('hello');//hello
        }else{
            console.log('else');//if false it will display this 
        }


        if(30 >= 16){
            console.log('can drive');//can drive
        }else{
            console.log('cannot drive')
        }

    </script>
</body>
</html>
