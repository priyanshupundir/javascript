<!--theory
best practise = use const by default(only use let when we need to change the variable).
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let variable1 = 3;
        console.log(variable1); // 3


        const calculation = 2 + 2;

        console.log(calculation); // 4

        console.log(calculation + 2);//6


        const result = calculation + 2;
        console.log(result);//6

        const message = 'hello'
        console.log(message);//hello

        variable1 = 5; 
        console.log(variable1); // updates the value to 5

        variable1 = variable1 + 1;
        console.log(variable1);// 6

        const variable2 = 3;
        variable2 = 5;// gives error 

        var variable3 = 3;

        console.log(typeof variable2);
        console.log(typeof message);
    </script>
</body>
</html>
