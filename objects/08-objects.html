<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const product = {
            name: 'socks',
            price: 1090
        };
        console.log(product);
        console.log(product.name);//socks
        console.log(product.price);//1090 

        product.name = 'cotton socks';
        console.log(product);// name: cotton socks

        product.newProperty = true;
        console.log(product);

        delete product.newProperty;
        console.log(product); 

        const product2 = {
            name: 'shirt',
            ['delivery-time']: '1 day',
            rating: {
                stars: 4.5,
                count: 87
            },

            fun: function function1(){
                console.log('fuction inside object');
            }
        };
        console.log(product2);
        console.log(product2.name);
        console.log(product2['name']);
        console.log(product2['delivery-time']);//undefined

        console.log(product2.rating.count);// 87
        product2.fun();//function inside ovjects 
        console.log(typeof console);//object
        console.log(typeof console.log)//function function inside object
        
        console.log(JSON.stringify(product2));//{"name":"shirt","delivery-time":"1 day","rating":{"stars":4.5,"count":87}}

        const jsonString = JSON.stringify(product2);
        console.log(JSON.parse(jsonString));//back into js object

        //Auto  boxing

        console.log('hello'.length);//5
        console.log('hello'.toUpperCase());//HELLO
        
        // objects are references.

        const object1 = {
            message: 'hello'
        };
        const object2 = object1;//copy the reference

        object1.message = 'good job!';
        console.log(object1);//good job
        console.log(object2);//good job

        const objects3 = {
            message:'good job!'
        };
        console.log(objects3 === object1);//false
        console.log(object2 === object1);//true

        //shortcut for objects
        const object4 = {
            message: 'good job1',
            price: 799
        };
        //const message = object4.message;
        const {message, price} = object4; //destructing
        console.log(message);//good job
        console.log(price);//799 

        // shorthand property
        const object5 = {
            //message: message
            message ,
            //method: function function1(){
               // console.log('method');
            //}
            method() {
                console.log('method');//same as above
            }
        };
        console.log(object5);//good job
        object5.method();//method
    </script>
</body>
</html>
