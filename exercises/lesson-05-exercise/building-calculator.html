<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="">
    <title>Document</title>
</head>
<body>
    <p>
        <button onclick="
        calculation += '1';//here adding 1 to the variable 
        console.log(calculation);">1</button>

        <button onclick="
        calculation += '2';//adding 2 to the variable and giving the value
        console.log(calculation);">2</button>

        <button onclick="
        calculation += '3';
        console.log(calculation);">3</button>

         <button onclick="
        calculation += ' + ';
        console.log(calculation);">+</button>
    </p>

    <p>
        <button onclick="
        calculation += '4';//here adding 1 to the variable 
        console.log(calculation);">4</button>

        <button onclick="
        calculation += '5';//adding 2 to the variable and giving the value
        console.log(calculation);">5</button>

        <button onclick="
        calculation += '6';
        console.log(calculation);">6</button>

         <button onclick="
        calculation -= ' - ';
        console.log(calculation);">-</button>

    </p>

    <p>
        <button onclick="
        calculation += '7';//here adding 1 to the variable 
        console.log(calculation);">7</button>

        <button onclick="
        calculation += '8';//adding 2 to the variable and giving the value
        console.log(calculation);">8</button>

        <button onclick="
        calculation += '9';
        console.log(calculation);">9</button>

         <button onclick="
        calculation += ' * ';
        console.log(calculation);">*</button>

    </p>

      <p>
        <button onclick="
        calculation += '0';//here adding 1 to the variable 
        console.log(calculation);">7</button>

        <button onclick="
        calculation += ' . ';//adding 2 to the variable and giving the value
        console.log(calculation);">.</button>

        <button onclick="
        //eval() takes a string and runs it as code.
        calculation = eval(calculation);
        console.log(calculation);">=</button>

         <button onclick="
        calculation += ' / ';
        console.log(calculation);">/</button>

    </p>

    <p>
       <button onclick="
        calculation = '';
        console.log('Cleared.');">Clear</button>
    </p>

    <script>
        let calculation = ''; // started by making a variable called calculation which takes the values;

    </script>
</body>
</html>
